<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="violet-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <rect width="32" height="32" rx="8" fill="#18181b" />
  
  <!-- Outer glowing ring -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="none" stroke="url(#violet-cyan)" stroke-width="1.2" opacity="0.3" />
  
  <!-- Sleek Link Chain / URL globe logo -->
  <g transform="translate(4, 4)" filter="url(#glow)">
    <!-- Intersecting path representing URL link / scan -->
    <path d="M7 14 C7 9.029 11.029 5 16 5 M16 5 C20.971 5 25 9.029 25 14" fill="none" stroke="url(#violet-cyan)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M12 12 C12 14.209 13.791 16 16 16 C18.209 16 20 14.209 20 12 C20 9.791 18.209 8 16 8" fill="none" stroke="url(#violet-cyan)" stroke-width="2" stroke-linecap="round" />
    <!-- Horizontal scan line -->
    <line x1="4" y1="12" x2="20" y2="12" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
